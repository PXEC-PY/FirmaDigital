<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script type="text/javascript">
      // GitHub Pages no soporta rutas del lado del cliente (React Router): esta página 404
      // codifica la ruta pedida en un query string y redirige a index.html, que la restaura.
      // Truco estándar: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1 // "/FirmaDigital" es 1 segmento de base path
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
