services:
  - type: web
    name: validador-firmas-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__SigningKey
        sync: false
      - key: Admin__Email
        sync: false
      - key: Admin__InitialPassword
        sync: false
      - key: ConnectionStrings__Postgres
        sync: false
      # Frontend servido desde GitHub Pages (PXEC-PY.github.io), no desde Render.
      - key: Cors__AllowedOrigins__0
        value: https://pxec-py.github.io
      - key: TrustStore__RootCertificatesPath
        value: /app/TrustedCertificates
      - key: TrustStore__CrlPath
        value: /app/CRL
