services:
  - type: web
    name: validador-firmas-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__SigningKey
        sync: false
      - key: Admin__Email
        sync: false
      - key: Admin__InitialPassword
        sync: false
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://validador-firmas.onrender.com
      - key: TrustStore__RootCertificatesPath
        value: /app/TrustedCertificates
      - key: TrustStore__CrlPath
        value: /app/CRL

  - type: web
    name: validador-firmas
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://validador-firmas-api.onrender.com/api/v1
